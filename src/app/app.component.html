<app-header *ngIf="!isAuthLayout"></app-header>

<section [ngClass]="{ 'main-layout': !isAuthLayout, 'auth-layout': isAuthLayout }">
  <app-navbar *ngIf="!isAuthLayout && !isNavbarClosed"></app-navbar>
<router-outlet *ngIf="isAuthLayout || (!isAuthLayout && (isNavbarClosed || windowWidth >= 992))"></router-outlet>
</section>
