<header class="header">
  <img src="assets/icon/dabubble_header.png" alt="header_logo" />
  <div class="search-container">
    <input id="search" type="search" placeholder="Devspace durchsuchen" (input)="searchDevspace($event)" />
    <mat-icon class="search-icon">search</mat-icon>
    @if (searchText != '') {
    <div class="search-results-container">
      <div class="member-box">
        <ul class="direct-messages-list">
          @for (user of filteredUsers; track user) {
            <li class="direct-messages-item">
              <div class="avatar">
                <img [src]="user.imgUrl" alt="User avatar" />
              </div>
              <p>{{ user.name }}</p>
            </li>
          }
        </ul>
      </div>
    </div>
  }
  </div>

  <div
    *ngIf="userProfile() as user"
    class="mat-button-profile logged-user"
    mat-button
    [matMenuTriggerFor]="baseMenu"
    (click)="showOverlay()"
    #menuTrigger="matMenuTrigger"
  >
    <div class="user-name">{{ user.name }}</div>
    <div class="profile-img-section">
      <img class="profile-img" [src]="user.imgUrl" alt="user" />
      <img class="status-img" src="assets/icon/Online.png" alt="online icon" />
    </div>
    <mat-icon>expand_more</mat-icon>
    <mat-menu
      class="mat-menu-profile"
      #baseMenu="matMenu"
      [hasBackdrop]="false"
      (menuOpened)="backdropVisible = true"
      (menuClosed)="onMenuClosed()"
    >
      <div class="profile-menu-wrap">
        <button class="mat-menu-item-btn" mat-menu-item (click)="openProfile()">
          Profil
        </button>
        <button class="mat-menu-item-btn" mat-menu-item (click)="logOut()">
          Log Out
        </button>
      </div>
    </mat-menu>
  </div>
</header>
<div
  class="custom-backdrop"
  [class.visible]="backdropVisible"
  (click)="closeAll()"
></div>

<app-user-profile
  *ngIf="profileCardOpen"
  (close)="closeProfile()"
></app-user-profile>
