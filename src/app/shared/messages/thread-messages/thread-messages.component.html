<div *ngIf="!editView" class="ticket-container" (mouseenter)="onMouseEnter()"
        (mouseleave)="onMouseLeave()">
    <div class="ticket" [ngClass]="{'reverse reverse-hover' : isCurrentUser()}" >
        <div class="member-img-ticket">
            <img src="assets/img/elias_neumann.svg" alt="">
        </div>
        <div class="message-content">

            <div class="name-date" [ngClass]="{'reverse' : isCurrentUser()}">
                <span class="msg-name"> {{ userName }}</span>
                <span class="msg-date">{{ time }} Uhr</span>
            </div>
            <div class="message-wrapper" [ngClass]="{'reverse' : isCurrentUser()}">
                <div class="message" [ngClass]="{'reverse-backround' : isCurrentUser()}">
                    <p>{{message.text}}</p>
                </div>
            </div>
            <!-- <div class="emoji-container" [ngClass]="{'reverse' : isCurrentUser()}" *ngIf="isReaction()">
                @for (emoji of ticket.reactions; track $index) {
                <div class="emoji" (mouseenter)="showPopup = true" (mouseleave)="showPopup = false">
                    <div class="emoji-popup" *ngIf="showPopup">
                        <img src="assets/emojis/thumb.svg">
                        <p>Sofie Müller</p>
                        <span>hat reagiert</span>
                    </div>
                    <img src="assets/emojis/thumb.svg">
                    <span>{{ ticket.reactions.length }}</span>
                </div>
                }
            </div> -->
        </div>
        <div class="emoji-menu" (click)="$event.stopPropagation()"
            [ngClass]="{ 'visible': showMenu, 'hidden': !showMenu, 'emoji-menu-reverse width-255' : isCurrentUser()}">
            <div class="emoji-menu-item"><img class="hover-purple" src="assets/icon/add_reaction.svg"></div>
            <div *ngIf="isCurrentUser()" class="emoji-menu-item">
                <mat-icon #menuTrigger="matMenuTrigger" [matMenuTriggerFor]="editTicket"
                    (menuOpened)="onEditMenuOpened()" (menuClosed)="onEditMenuClosed()">more_vert</mat-icon>
                <mat-menu #editTicket="matMenu" class="edit-menu">
                    <span (click)="openEditView()" mat-menu-item>Nachricht bearbeiten</span>
                </mat-menu>
            </div>
        </div>

    </div>
</div>
<div *ngIf="editView" class="ticket-edit">

    <div class="message-edit">
        <textarea class="edit-textarea" [(ngModel)]="editedText" name="edit-textarea" id="edit_textarea"></textarea>
        <div class="button-container">
            <div class="input-icon">
                <img src="assets/icon/reaction.png" alt="">
            </div>
            <div class="buttons">
                <span class="secondary-button" (click)="editView = false">Abbrechen</span>
                <span class="primary-button" (click)="editText()">Speichern</span>
            </div>

        </div>

    </div>
</div>
