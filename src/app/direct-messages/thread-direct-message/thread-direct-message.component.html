<section>
  <div class="content">
    <header>
      <div class="channel-name">
        <h2>Thread</h2>
        <span># Entwicklerteam</span>
      </div>
      <div class="close-dialog" (click)="closeThread()">
        <mat-icon class="icon">close</mat-icon>
      </div>
    </header>
    <main>
      <div class="scroller-wrapper">
        <app-message-ticket
          *ngIf="message && channelId"
          [message]="message"
          [channelId]="channelId"
          [inThreadView]="false"
        ></app-message-ticket>
        <div *ngFor="let msg of threadMessages">
          <app-message-ticket
            *ngIf="message && channelId"
            [channelId]="channelId"
            [inThreadView]="true"
            [message]="msg"
            [threadId]="msg.id"
            [messageId]="message.id!"
          ></app-message-ticket>
        </div>

        <div class="placeholder">
          <div class="placeholder-date msg-answer">2 Answers</div>
        </div>
      </div>
    </main>
    <footer>
      <div class="text-area">
        <textarea
          name="chat_input"
          id="chat_input"
          placeholder="Antworten..."
        ></textarea>
      </div>
      <div class="input-buttons">
        <div class="icons">
          <div class="input-icon">
            <img src="assets/icon/reaction.png" alt="" />
          </div>
          <div class="input-icon">
            <img src="assets/icon/tag_icon.png" alt="" />
          </div>
        </div>
        <div class="send-icon">
          <img src="assets/icon/send.png" alt="" />
        </div>
      </div>
    </footer>
  </div>
</section>
